name: 🛡️ CI

on:
  push:
    branches:
      - main
      - '!changeset-release/**'
      - '!release/**'
  pull_request:
    branches:
      - main
      - '!changeset-release/**'
      - '!release/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality-pipeline:
    name: ⚡ Quality Pipeline
    runs-on: ubuntu-latest
    # Skip CI for automated changeset versioning and release branches to conserve runner minutes
    if: "!startsWith(github.head_ref, 'changeset-release/') && !startsWith(github.head_ref, 'release/')"

    steps:
      - name: 📡 Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: ⬡ Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 📦 Enable Corepack
        run: corepack enable

      - name: 🔒 Install dependencies (Yarn Immutable)
        run: yarn install --immutable

      - name: 🧹 Gate 1 — Biome Lint & Format Check
        run: yarn lint

      - name: 🔬 Gate 2 — Fallow Structural Health Audit
        run: yarn quality

      - name: 📐 Gate 3 — TypeScript Typecheck
        run: yarn typecheck

      - name: 🧪 Gate 4 — Vitest Unit & Integration Tests
        run: yarn test

      - name: 🏗️ Gate 5 — Turborepo Build
        run: yarn build

      - name: 🎭 Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: 🎮 Gate 6 — Playwright Smoke Suite (@smoke)
        run: yarn test:e2e:smoke

      - name: 💾 Upload Playwright test results on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-test-results
          path: apps/web/test-results/
          retention-days: 7
