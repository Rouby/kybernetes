name: 🌙 Nightly E2E

on:
  schedule:
    # Off-peak full run: the @slow host-timing-sensitive specs live here,
    # never in blocking CI (see Gate 6, which runs the @smoke suite).
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-e2e:
    name: 🎮 Full Playwright Suite (non-blocking)
    runs-on: ubuntu-latest
    steps:
      - name: 📡 Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: ⬡ Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 📦 Enable Corepack
        run: corepack enable

      - name: 🔒 Install dependencies (Yarn Immutable)
        run: yarn install --immutable

      - name: 🏗️ Turborepo Build
        run: yarn build

      - name: 🎭 Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: 🎮 Playwright Suite (smoke + @slow)
        run: yarn test:e2e

      - name: 💾 Upload Playwright test results on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-test-results
          path: apps/web/test-results/
          retention-days: 7
