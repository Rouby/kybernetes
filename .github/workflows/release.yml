name: 🚀 Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: 📦 Changesets Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: 📡 Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: ⬡ Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 📦 Enable Corepack
        run: corepack enable

      - name: 🔒 Install dependencies (Yarn Immutable)
        run: yarn install --immutable

      - name: 🏗️ Turborepo Build
        run: yarn build

      - name: 🏷️ Create release PR or publish (Changesets)
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: yarn version-packages
          publish-script: yarn release
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
