name: 🚀 Kybernetes Fleet Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: 📦 Changesets Shipyard & Dispatch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: 📡 Intercept Fleet Repository (Checkout)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: ⬡ Calibrate Node.js 24 Runtime
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 📦 Enable Corepack
        run: corepack enable

      - name: 🔒 Provision Shipyard Modules (Yarn Immutable)
        run: yarn install --immutable

      - name: 🏗️ Synthesize Production Builds
        run: yarn build

      - name: 🏷️ Dispatch Version Manifest or Launch Release
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: yarn version-packages
          publish-script: yarn release
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
